<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'"><title>Reqoto</title><script src="surface.js"></script><link rel="stylesheet" href="style.css"></head><body>
<div class="titlebar"></div><button id="sidebar-toggle" class="icon" data-title="toggleSidebar" aria-expanded="true" aria-controls="identities"></button>
<aside><div class="rail-head"><span data-i="accounts">账号</span><button id="add" class="icon" data-title="add">＋</button></div><nav id="identities"></nav><div class="rail-bottom"><button id="language">EN</button><button id="theme" data-title="appearance">◐</button><span id="version">0.8</span></div></aside>
<div id="social-outline" aria-hidden="true"></div>
<div id="rail-divider" class="divider" role="separator" tabindex="0" aria-orientation="vertical" data-title="resize"></div>
<div class="pane-toolbar social-tools"><button class="icon" data-side="social" data-command="back" data-title="back">←</button><button class="icon" data-side="social" data-command="reload" data-title="reload">↻</button><span class="location"><span id="name">—</span><span id="social-loading" class="loading" hidden></span></span><button id="settings" class="icon" data-title="settings" aria-expanded="false" aria-controls="settings-drawer">⚙</button></div>
<div class="pane-toolbar ai-tools"><button id="ai-address" class="location" data-title="chooseAI"><span id="ai-label">ChatGPT</span><span id="ai-loading" class="loading" hidden></span></button><button class="icon" data-side="ai" data-command="reload" data-title="reload">↻</button></div>
<div id="pane-divider" class="divider" role="separator" tabindex="0" aria-orientation="vertical" data-title="resize"></div>
<main id="empty"><button id="first" data-i="add">添加账号</button></main>
<section id="social-error" class="error" hidden><strong data-i="loadFailed">无法加载页面</strong><p></p><button data-retry="social" data-i="retry">重试</button></section>
<section id="ai-error" class="error" hidden><strong data-i="loadFailed">无法加载页面</strong><p></p><button data-retry="ai" data-i="retry">重试</button></section>
<button id="settings-backdrop" type="button" tabindex="-1" data-title="close" hidden></button>
<section role="dialog" id="settings-drawer" aria-labelledby="settings-title" hidden>
<header class="drawer-header"><div><h2 id="settings-title" data-i="settings">账号设置</h2><small id="settings-account"></small></div><button id="close-settings" type="button" class="icon" data-title="close">×</button></header>
<div class="settings-tabs" role="tablist" data-title="settings"><button type="button" role="tab" id="tab-basic" aria-controls="settings-basic" data-tab="basic" aria-selected="true" data-i="basic">基础</button><button type="button" role="tab" id="tab-models" aria-controls="settings-models" data-tab="models" aria-selected="false" data-i="models">模型</button><button type="button" role="tab" id="tab-advanced" aria-controls="settings-advanced" data-tab="advanced" aria-selected="false" data-i="advanced">高级</button></div>
<form id="settings-form"><div class="settings-scroll">
<section id="settings-basic" role="tabpanel" aria-labelledby="tab-basic">
<label><span data-i="template">提示词模板</span><select id="template-select"></select></label>
<div class="template-save"><input id="template-name" maxlength="60" data-placeholder="templateName" aria-label="Template name"><button id="save-template" type="button" data-i="saveTemplate">存为模板</button><button id="delete-template" type="button" data-title="deleteTemplate">−</button></div>
<label><span data-i="persona">人设与经验</span><textarea id="persona" rows="3" maxlength="2000" data-placeholder="personaHint"></textarea></label>
<div class="field-pair"><label><span data-i="tone">语气</span><select id="tone"><option value="natural" data-i="natural">自然</option><option value="friendly" data-i="friendly">友好</option><option value="professional" data-i="professional">专业</option><option value="playful" data-i="playful">轻松有趣</option></select></label><label><span data-i="voice">表达方式</span><select id="voice"><option value="direct" data-i="direct">直接具体</option><option value="curious" data-i="curious">好奇提问</option><option value="empathetic" data-i="empathetic">共情交流</option></select></label></div>
<div class="field-pair"><label><span data-i="replyLanguage">回复语言</span><select id="reply-language"><option value="source" data-i="followPost">跟随原帖</option><option value="zh">中文</option><option value="en">English</option></select></label><label><span data-i="length">回复长度</span><select id="reply-length"><option value="short" data-i="short">简短</option><option value="normal" data-i="normal">适度展开</option></select></label></div>
<label><span data-i="topics">关注主题</span><textarea id="topics" rows="2" maxlength="2000" data-placeholder="topicsHint"></textarea></label>
<label><span data-i="avoid">避免的表达</span><textarea id="avoid" rows="2" maxlength="2000" data-placeholder="avoidHint"></textarea></label>
<p id="custom-notice" class="hint" data-i="customNotice" hidden>当前使用高级自定义提示词。基础项仍用于筛选。</p>
</section>
<section id="settings-models" role="tabpanel" aria-labelledby="tab-models" hidden>
<label><span data-i="screenGoal">参与目标</span><select id="screenGoal"><option value="conversation" data-i="goalConversation">建立交流</option><option value="share-experience" data-i="goalExperience">分享经验</option><option value="find-needs" data-i="goalNeeds">发现真实需求</option></select></label>
<label><span data-i="skipTopics">跳过的话题</span><textarea id="skipTopics" rows="2" maxlength="2000" data-placeholder="skipTopicsHint"></textarea></label>
<label><span data-i="screening">筛选倾向</span><select id="screening"><option value="balanced" data-i="balanced">平衡</option><option value="strict" data-i="strict">只推荐明确机会</option></select></label>
<p class="hint" data-i="screenHelp">结合基础页的人设、主题判断。结果只作标记；用帖子工具条 ＋ / − 纠正。</p>
<label class="check"><input id="analysis-enabled" type="checkbox"><span data-i="enableAnalysis">筛选当前可见帖子</span></label>
<label><span data-i="engine">判断方式</span><select id="engine"><option value="d1-local">d1 · Local</option><option value="liquid-d1">Liquid d1 · BYOK</option><option value="jev">Jev · BYOK</option></select></label>
<p id="engine-help" class="hint"></p>
<div id="local-models"><div class="model-row"><div><strong>d1</strong><small id="d1-state"></small></div><button type="button" data-model-file="d1" data-i="chooseFile">选择文件</button><button type="button" data-model-start="d1" data-i="start">启动</button><button type="button" data-model-stop="d1" data-i="stop">停止</button></div><div class="model-row"><div><strong>d1 Vision</strong><small id="vision-state"></small></div><button type="button" data-model-file="mmproj" data-i="chooseFile">选文件</button></div><button type="button" class="text-button" data-model-file="runtime" data-i="chooseRuntime">选择推理程序</button><p id="runtime-state" class="hint"></p></div>
<div id="cloud-models" hidden><label><span>API Key</span><input id="api-key" type="password" autocomplete="off" spellcheck="false" maxlength="500" placeholder="API key"></label><div class="inline-actions"><button type="button" id="save-key" data-i="saveKey">保存密钥</button><button type="button" id="remove-key" data-i="removeKey">移除密钥</button><small id="key-state"></small></div><p class="hint" data-i="cloudNotice">开启筛选后，帖子文字、账号偏好和相关纠正例子将发给所选提供商。</p></div>
<label><span data-i="testText">测试一段文字</span><textarea id="test-text" rows="3" maxlength="6000" data-placeholder="testHint"></textarea></label><div class="inline-actions"><button type="button" id="test-model" data-i="testModel">测试判断</button><button type="button" id="test-image" data-i="testImage">测试图片</button><button type="button" id="recheck" data-i="recheck">重新筛选页面</button></div><p id="test-result" class="test-result" role="status"></p>
</section>
<section id="settings-advanced" role="tabpanel" aria-labelledby="tab-advanced" hidden>
<label><span data-i="criteria">帖子筛选条件</span><textarea id="criteria" rows="4" maxlength="4000" data-placeholder="criteriaHint"></textarea></label>
<label class="check"><input id="custom-prompt" type="checkbox"><span data-i="customPrompt">使用完整自定义提示词</span></label>
<label><span data-i="promptLanguage">提示词语言</span><select id="prompt-language"><option value="zh">中文</option><option value="en">English</option></select></label>
<label><span data-i="fullPrompt">完整回复提示词</span><textarea id="full-prompt" rows="11" maxlength="20000" spellcheck="false"></textarea></label><p class="hint" data-i="promptHelp">关闭自定义后，完整提示词由基础项生成。</p>
<div class="settings-rule"></div><div class="inline-actions"><span id="feedback-count"></span><button type="button" id="clear-feedback" data-i="clearFeedback">清空纠正例子</button></div>
<label><span data-i="appearance">外观</span><select id="appearance"><option value="system" data-i="system">跟随系统</option><option value="light" data-i="light">浅色</option><option value="dark" data-i="dark">深色</option></select></label>
<section class="danger-zone" aria-labelledby="danger-title"><h3 id="danger-title">Danger Zone</h3><p data-i="deleteAccountHelp">删除当前账号在此工作台中的登录状态、提示词和纠正记录。不会注销社媒账号，其他账号和 AI 对话不受影响。</p><button type="button" id="delete-account" data-i="deleteAccount">删除当前账号…</button></section>
</section>
</div><footer class="drawer-footer"><span id="settings-error" role="status"></span><button type="submit" class="primary" data-i="save">保存</button></footer></form>
</section>
<output id="status" role="status"></output>
<dialog id="editor"><form id="form"><h2 id="dialog-title"></h2><div id="platform-field"><label><span data-i="platform">平台</span><select id="platform"><option value="https://x.com/home">X</option><option value="https://www.xiaohongshu.com/explore">小红书</option><option value="custom" data-i="other">其他网站</option></select></label></div><label id="social-field"><span data-i="address">地址</span><input name="socialUrl" type="url" value="https://x.com/home" required></label><label id="provider-field"><span>AI</span><select name="provider"><option value="chatgpt">ChatGPT</option><option value="grok">Grok</option></select></label><label id="ai-field"><span data-i="conversation">对话地址</span><input name="aiUrl" type="url"></label><p id="form-error" role="alert"></p><div class="actions"><button type="button" id="cancel" data-i="cancel">取消</button><button class="primary" data-i="save">保存</button></div></form></dialog><script src="layout.cjs"></script><script src="preferences.cjs"></script><script src="ui.js"></script></body></html>
